[tool.poetry]
name = "OpenPIV"
version = "0.26.1"
description = "OpenPIV consists in a Python and Cython modules for scripting and executing the analysis of a set of PIV image pairs. In addition, a Qt and Tk graphical user interfaces are in development, to ease the use for those users who don't have python skills."
authors = ["Alex Liberzon"]
license = "GPLv3"
readme = "README.md"
packages = [{include = "openpiv"}]
classifiers = [
    "Development Status :: 4 - Beta",

    # Sublist of all supported Python versions.
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",

    # Sublist of all supported platforms and environments.
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",

    # Miscellaneous metadata.
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]

[tool.poetry.dependencies]
python = ">=3.10"
numpy = ">=2.0.0"
imageio = ">=2.35.0"
matplotlib = ">=3.8.0"
scikit-image = ">=0.23.0"
scipy = ">=1.11.0"
natsort = ">=8.4.0"
tqdm = ">=4.66.0"
openpiv-rust = { version = ">=0.1.0", optional = true }

[tool.poetry.extras]
rust = ["openpiv-rust"]

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
maturin = "^1.5.0"
ruff = ">=0.6.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.plugins."pypi.org"]
OpenPIV = "OpenPIV"

[tool.poetry.urls]
"Documentation" = "http://openpiv.readthedocs.org"  # Add your documentation URL here
"Repository" = "https://pypi.python.org/pypi/OpenPIV"  # Add your repository URL here

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "openpiv/smoothn.py",  # vendored port of smoothn.m, not ours to reformat
    "*.ipynb",             # notebooks are examples, they are not linted
]

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E",    # pycodestyle
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "RUF",  # ruff specific rules
]
ignore = [
    "E402",   # module level import not at top of file (common in scripts)
    "E501",   # line length is handled by the formatter, not the linter
    "E741",   # ambiguous variable names (l, I) are idiomatic in numeric code
    "B008",   # function call in default argument (numpy-like defaults)
    "B905",   # zip without strict= (py3.9 compatibility is not required)
    "RUF001", # ambiguous unicode in strings (the docs use mu, sigma, ...)
    "RUF002",
    "RUF003",
    "RUF012", # mutable class attributes need a ClassVar annotation
    "RUF059", # unused unpacked variables are common in numeric code
    "SIM108", # ternary instead of if/else is not always clearer
]

[tool.ruff.lint.per-file-ignores]
"openpiv/docs/*" = ["F401", "F403", "F405", "E402"]
"openpiv/calibration/*" = ["F401", "F403", "F405"]
"openpiv/test/*" = ["F401", "F403", "F405", "F811"]
"benchmarks/*" = ["F401", "F403", "F405", "E402"]
