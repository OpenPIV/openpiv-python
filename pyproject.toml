[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "OpenPIV"
version = "0.26.3"
description = "OpenPIV consists in a Python and Cython modules for scripting and executing the analysis of a set of PIV image pairs. In addition, a Qt and Tk graphical user interfaces are in development, to ease the use for those users who don't have python skills."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-only" }
authors = [
  { name = "Alex Liberzon" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=2.0.0",
  "imageio>=2.35.0",
  "matplotlib>=3.8.0",
  "scikit-image>=0.23.0",
  "scipy>=1.11.0",
  "natsort>=8.4.0",
  "pyyaml>=6.0",
  "tqdm>=4.66.0",
  "pillow>=13.0.0",
]

[project.optional-dependencies]
rust = ["openpiv-rust>=0.1.0"]

[project.urls]
Documentation = "http://openpiv.readthedocs.org"
Repository = "https://github.com/OpenPIV/openpiv-python"

[dependency-groups]
dev = [
  "pytest>=7.4.3",
  "maturin>=1.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["openpiv"]

[tool.hatch.build.targets.sdist]
include = [
  "/openpiv",
  "/README.md",
  "/LICENSE.txt",
  "/pyproject.toml",
]
